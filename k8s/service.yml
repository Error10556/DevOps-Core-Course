apiVersion: v1
kind: Service
metadata:
  name: devops-infoservice-service
spec:
  type: NodePort
  selector:
    app: devops-infoservice  # Must match Deployment labels
  ports:
    - protocol: TCP
      port: 80        # Service port
      targetPort: 5000  # Container port
      nodePort: 30080   # Optional: specific node port (30000-32767)
